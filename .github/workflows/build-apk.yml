name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      appName:
        description: "App name"
        required: false
      packageName:
        description: "Package name"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate keystore if missing
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -alias appkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=AppForge, OU=Dev, O=AppForge, L=Manila, S=NCR, C=PH"
          fi

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=appkey \
            -Pandroid.injected.signing.key.password=android

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
