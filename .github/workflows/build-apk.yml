name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      appName:
        description: "App name"
        required: false
      packageName:
        description: "Package name"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate keystore if missing
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -alias appkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=AppForge, OU=Dev, O=AppForge, L=Manila, S=NCR, C=PH"
          fi

      - name: Apply config from build-config.json
        run: |
          if [ -f app/build-config.json ]; then
            APP_NAME=$(jq -r '.appName' app/build-config.json)
            PKG=$(jq -r '.packageName' app/build-config.json)
            VER_NAME=$(jq -r '.versionName' app/build-config.json)
            VER_CODE=$(jq -r '.versionCode' app/build-config.json)

            sed -i "s/applicationId \".*\"/applicationId \"$PKG\"/" app/build.gradle
            sed -i "s/versionName \".*\"/versionName \"$VER_NAME\"/" app/build.gradle
            sed -i "s/versionCode .*/versionCode $VER_CODE/" app/build.gradle
            sed -i "s/namespace '.*'/namespace '$PKG'/" app/build.gradle

            echo "Applied: $APP_NAME ($PKG) v$VER_NAME"
          fi

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=appkey \
            -Pandroid.injected.signing.key.password=android

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
